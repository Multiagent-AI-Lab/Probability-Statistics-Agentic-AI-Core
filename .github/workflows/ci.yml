name: CI Pipeline - Probabilidad y Estadística

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Formato y lint del código de agentes y de tests -- el mismo alcance
      # que CLAUDE.md documenta (`isort/black src/ tests/`), ahora exigido en
      # CI en vez de solo declarado. `scripts/` (incluyendo `scripts/legacy/`)
      # queda fuera a propósito: son scripts de un solo uso, varios ya
      # ejecutados y conservados como historial, nunca en el alcance
      # declarado de formato del repo.
      - name: Check formatting and lint (ruff / black / isort)
        run: |
          ruff check src/multiagent_core/ tests/
          black --check src/multiagent_core/ tests/
          isort --check-only src/multiagent_core/ tests/

      - name: Run pytest test suite
        run: |
          pytest

      # B1' (auditoría 2026-09-14): tests/test_readme_badge.py compara el
      # badge contra una constante mantenida a mano -- tautológico, nunca
      # contra pytest. Este step es el gate real: compara README.md
      # directamente contra el conteo que pytest recolecta en esta misma
      # corrida de CI.
      - name: Verify README test badge matches real count
        run: |
          REAL=$(pytest --collect-only -q | tail -1 | grep -oE '^[0-9]+')
          BADGE=$(grep -oE 'tests-[0-9]+' README.md | grep -oE '[0-9]+')
          if [ "$REAL" != "$BADGE" ]; then
            echo "Badge dice $BADGE, pytest recolectó $REAL -- actualiza README.md"
            exit 1
          fi
          echo "Badge OK: $BADGE == $REAL"

      # Gate explícito de H-01: el Consejo debe rechazar documentos sin
      # contenido real. Se corre por separado —aunque `pytest` ya lo
      # incluya— para que una regresión aquí se lea de inmediato en el log
      # como "el Consejo volvió a aprobar basura", y no se pierda entre los
      # demás fallos de la suite.
      - name: Adversarial gate - el Consejo debe discriminar contenido real
        run: |
          pytest tests/council/test_adversarial.py -v

      - name: Verify Notebook Compilation Pipeline
        run: |
          python -c "from src.multiagent_core.orchestrator_agent import OrchestratorAgent; OrchestratorAgent().run_full_pipeline()"
