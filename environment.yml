name: ia_stats
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - pandas
  # Pin exacto: crash nativo de scipy/OpenBLAS vía seaborn.histplot(kde=True)
  # bloqueaba @Engineer y afectaba 14-15 tests (ver GOVERNANCE.md, A3-U).
  # NO es una decision de vigencia -es un workaround de ese crash puntual-,
  # y a la fecha de este comentario (2026-09-19) va 2 versiones minor por
  # detras de la estable real (1.18.1, ago-2026: https://scipy.org/news/).
  # Antes de subir la version: reproducir el crash original con la nueva
  # version primero; si ya no ocurre, quitar el pin en el mismo commit que
  # actualiza GOVERNANCE.md, no solo aqui.
  - scipy=1.14.1
  - statsmodels
  - matplotlib
  - seaborn
  - sympy
  - jupyterlab
  - ipykernel
  - nbformat
  - networkx
  - pip
  - pip:
      - pytest>=7.0.0
      - pytest-mock>=3.0.0
      - ipytest>=0.14.0
      - black>=24.0.0
      - isort>=5.13.0
      - ruff>=0.5.0
      - python-dotenv>=1.0.0,<2.0.0
      - scikit-learn>=1.3.0,<2.0.0
      - rich>=13.0.0
      - pydantic>=2.0.0,<3.0.0
      - pypdf>=4.0.0
      - chromadb>=0.5.0
      - sentence-transformers>=3.0.0
      - beautifulsoup4>=4.12.0
      - lxml>=5.0.0
      - requests>=2.31.0
      - google-genai>=1.0.0
