ormar cada X_i mediante g(X_i)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Agregar-4" data-look="classic" transform="translate(293, 339)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Agregar: promediar y escalar -&gt; theta_N = (b-a)/N * suma(g(X_i))</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Validar-6" data-look="classic" transform="translate(293, 579)"><polygon points="139,0 278,-139 139,-278 0,-139" class="label-container" transform="translate(-138.5, 139)"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>El error decrece como O(N^-1/2) al aumentar N?</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Aceptar-8" data-look="classic" transform="translate(138, 843)"><rect class="basic label-container" style="" x="-130" y="-39" width="260" height="78"/><g class="label" style="" transform="translate(-100, -24)"><rect/><foreignObject width="200" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Aceptar theta_N como estimador valido</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-Revisar-10" data-look="classic" transform="translate(448, 843)"><rect class="basic label-container" style="" x="-130" 